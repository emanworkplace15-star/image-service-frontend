name: Frontend CI/CD

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # required for AWS OIDC — no static keys in repo secrets
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::233338945000:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # NEXT_PUBLIC_API_URL is baked into the Next.js client bundle at build
      # time, so the ALB URL must be set as a repository *variable* (not a
      # secret — it's a public URL): Settings → Secrets and variables →
      # Actions → Variables → NEXT_PUBLIC_API_URL = http://<alb-dns>
      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npx next build
          test -f out/index.html || { echo "static export missing out/index.html"; exit 1; }
          echo "Built static export, NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-<unset>}" >> $GITHUB_STEP_SUMMARY

      # Static site bucket (dev: served by the S3 website endpoint; the
      # publish role already has s3:PutObject / s3:DeleteObject on it).
      - name: Sync to S3
        env:
          BUCKET: image-service-static-frontend
        run: |
          aws s3 sync out/ s3://$BUCKET --delete
          echo "Synced to s3://$BUCKET" >> $GITHUB_STEP_SUMMARY

      # CloudFront invalidation (when CloudFront is enabled again — the
      # account needs verification first):
      # aws cloudfront create-invalidation --distribution-id <id> --paths "/*"